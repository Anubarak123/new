services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolquiz
      POSTGRES_PASSWORD: toolquiz
      POSTGRES_DB: toolquiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolquiz"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
